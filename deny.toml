# cargo-deny policy: run `cargo deny check` (CI runs it on every push).

[graph]
# Include optional features (e.g. the AF_XDP backend's native dependencies).
all-features = true
# Check every platform we build for, including Linux-only dependencies.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Any RustSec advisory (vulnerability, unmaintained, unsound) fails the check.
yanked = "deny"

[licenses]
# Permissive licenses only.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # Native AF_XDP dependencies (optional `xdp` feature): libbpf-sys and
    # libxdp-sys (vendored libbpf/libxdp, taken under BSD-2-Clause), bindgen,
    # and libloading.
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are `publish = false` and carry no license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version requirement by design.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
