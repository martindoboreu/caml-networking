[package]
name = "caml-transport-xdp"
description = "AF_XDP receive backend for caml-engine (Linux; enable the `xdp` feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Off by default. Enabling it builds vendored libxdp and libbpf, which needs
# clang, libclang, libelf, zlib, libpcap headers, m4, and gcc-multilib
# (installed by scripts/wsl-setup.sh; see docs/linux-dev.md).
xdp = ["dep:xsk-rs"]

[dependencies]
caml-engine.workspace = true
caml-frame.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
xsk-rs = { version = "0.11.0", optional = true }

[dev-dependencies]
caml-alloc-count.workspace = true
caml-engine.workspace = true
caml-protocol.workspace = true
caml-sim.workspace = true
socket2.workspace = true

# This crate opts out of the workspace's `unsafe_code = "forbid"`: AF_XDP
# rings and UMEM frames are reached through `xsk-rs` functions whose safety
# contracts the caller must uphold. `unsafe` is allowed only in `source.rs`,
# and every block documents its invariant (enforced below).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
